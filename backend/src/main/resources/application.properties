spring.application.name=knowbridge-ai-backend

server.port=${PORT:8080}
server.servlet.context-path=/

# Database Configuration
# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/knowbridge_ai_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:jlldZEMD6tS8mcX3}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Settings
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# JWT Configuration
jwt.secret=${JWT_SECRET:4c8916327b8744b68e9821a719d361b24e16a2b8e390c5f210d7a46973e21894a}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator
management.endpoints.web.exposure.include=health,info

# Logging
logging.level.com.knowbridge.ai=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
